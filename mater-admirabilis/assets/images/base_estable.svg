<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <line x1="500" y1="200" x2="500" y2="800" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>

  <defs>
    <!-- RIGHT: STABLE (FLAT BASE) -->
    <g id="gobi-stable">
      <path d="
        M -95, 140 
        L -35, 140 
        C -22, 140 -15, 122 0, 122 
        C 15, 122 22, 140 35, 140 
        L 95, 140 
        C 120, 140 126, 115 125, 75 
        C 125, 52 142, 38 152, 18 
        C 162, -2 152, -24 134, -22 
        C 122, -21 116, -10 112, 12 
        C 108, -50 92, -145 0, -145 
        C -92, -145 -108, -50 -112, 12 
        C -116, -10 -122, -21 -134, -22 
        C -152, -24 -162, -2 -152, 18 
        C -142, 38 -125, 52 -125, 75 
        C -126, 115 -120, 140 -95, 140
        Z
      " fill="#000000"/>
      <circle cx="-42" cy="-22" r="18" fill="#FFFFFF"/>
      <circle cx="42" cy="-22" r="18" fill="#FFFFFF"/>
      <path d="M -26, 12 C -24, 38 24, 38 26, 12 C 16, 18 -16, 18 -26, 12 Z" fill="#FFFFFF"/>
    </g>

    <!-- LEFT: UNSTABLE (ROUND EGG BOTTOM) -->
    <g id="gobi-unstable">
      <path d="
        M 0, 150 
        C 75, 150 122, 105 125, 75 
        C 125, 52 142, 38 152, 18 
        C 162, -2 152, -24 134, -22 
        C 122, -21 116, -10 112, 12 
        C 108, -50 92, -145 0, -145 
        C -92, -145 -108, -50 -112, 12 
        C -116, -10 -122, -21 -134, -22 
        C -152, -24 -162, -2 -152, 18 
        C -142, 38 -125, 52 -125, 75 
        C -122, 105 -75, 150 0, 150
        Z
      " fill="#000000"/>
      <circle cx="-42" cy="-22" r="18" fill="#FFFFFF"/>
      <circle cx="42" cy="-22" r="18" fill="#FFFFFF"/>
      <path d="M -26, 12 C -24, 38 24, 38 26, 12 C 16, 18 -16, 18 -26, 12 Z" fill="#FFFFFF"/>
    </g>
  </defs>

  <!-- Left side: rolling unstable Gobi -->
  <g transform="translate(250, 505) rotate(-36)">
    <use href="#gobi-unstable"/>
  </g>

  <!-- Right side: firm flat-based Gobi -->
  <g transform="translate(750, 500)">
    <use href="#gobi-stable"/>
  </g>
</svg>