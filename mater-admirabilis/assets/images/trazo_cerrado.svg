<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <line x1="500" y1="200" x2="500" y2="800" stroke="#F1F5F9" stroke-width="3" stroke-linecap="round"/>

  <!-- LEFT: OPEN/FAINT LINES WITH INK LEAKING -->
  <g transform="translate(250, 500)">
    <!-- Broken, faint scratchy outline (lápiz tenue / trazo abierto) -->
    <path d="
      M -95, 140 L -50, 140
      M -20, 140 L 0, 125
      M 15, 125 L 35, 140 M 50, 140 L 95, 140
      M 110, 130 C 120, 115 125, 95 125, 75
      M 128, 45 C 138, 35 150, 20 152, 10
      M 148, -10 C 140, -22 130, -22 120, -18
      M 112, 5 C 110, -20 100, -60 80, -100
      M 65, -120 C 58, -125 45, -125 40, -115
      M 25, -140 C 15, -145 0, -145 -10, -140
      M -35, -140 C -45, -125 -55, -120 -60, -110
      M -85, -85 C -96, -50 -105, -10 -110, 10
      M -125, -18 C -140, -22 -148, -10 -152, 10
      M -145, 25 C -135, 40 -125, 55 -125, 75
      M -125, 95 C -122, 115 -115, 130 -95, 140
    " stroke="#94A3B8" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" fill="none"/>

    <!-- Broken facial features -->
    <circle cx="-42" cy="-22" r="18" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
    <circle cx="42" cy="-22" r="18" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
    <path d="M -26, 12 C -20, 30 20, 30 26, 12" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 6" fill="none"/>

    <!-- Ink leaks dropping out through gaps -->
    <circle cx="95" cy="165" r="7" fill="#CBD5E1"/>
    <circle cx="115" cy="190" r="5" fill="#E2E8F0"/>
    <circle cx="-160" cy="50" r="6" fill="#CBD5E1"/>
    <circle cx="-175" cy="75" r="4" fill="#E2E8F0"/>
    <circle cx="160" cy="50" r="6" fill="#CBD5E1"/>
    <circle cx="0" cy="-170" r="5" fill="#CBD5E1"/>
  </g>

  <!-- RIGHT: SOLID CONTINUOUS BLACK MARKER SILHOUETTE -->
  <g transform="translate(750, 500)">
    <path d="
      M -95, 140
      L -35, 140
      C -20, 140 -15, 125 0, 125
      C 15, 125 20, 140 35, 140
      L 95, 140
      C 120, 140 125, 115 125, 75
      C 125, 52 142, 38 152, 18
      C 162, -2 152, -24 134, -22
      C 122, -21 116, -10 112, 12
      C 106, -30 96, -80 75, -115
      C 70, -125 55, -125 50, -115
      C 42, -135 25, -145 15, -145
      C 5, -145 -5, -135 -15, -145
      C -25, -145 -42, -135 -50, -115
      C -55, -125 -70, -125 -75, -115
      C -96, -80 -106, -30 -112, 12
      C -116, -10 -122, -21 -134, -22
      C -152, -24 -162, -2 -152, 18
      C -142, 38 -125, 52 -125, 75
      C -125, 115 -120, 140 -95, 140
      Z
    " fill="#000000"/>
    <circle cx="-42" cy="-22" r="18" fill="#FFFFFF"/>
    <circle cx="42" cy="-22" r="18" fill="#FFFFFF"/>
    <path d="M -26, 12 C -24, 38 24, 38 26, 12 C 16, 18 -16, 18 -26, 12 Z" fill="#FFFFFF"/>
  </g>
</svg>